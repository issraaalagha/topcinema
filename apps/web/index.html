<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>FreeWatch — أفلام ومسلسلات بجودة عالية وبدون إعلانات</title>
    <script>
      // Self-heal watchdog: if the app shell fails to mount (stale Service
      // Worker serving deleted hashed bundles), unregister workers, purge
      // caches, and reload once per session.
      (function () {
        setTimeout(function () {
          if (window.__TC_MOUNTED__) return;
          if (sessionStorage.getItem('tc_selfheal')) return;
          sessionStorage.setItem('tc_selfheal', '1');
          var cleanup = Promise.resolve();
          if ('caches' in window) {
            cleanup = caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {});
          }
          cleanup.then(function () {
            if (navigator.serviceWorker) {
              return navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {});
            }
          }).then(function () { location.reload(); });
        }, 4000);
      })();
    </script>
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="FreeWatch — مشاهدة أفلام ومسلسلات بجودة عالية 1080p وبدون إعلانات" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- High-Performance Typography: Alexandria Variable Arabic Font (2026 Standards) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
      window.__onGCastApiAvailable = function (loaded, errorInfo) {
        window.dispatchEvent(new CustomEvent('cast-available', { detail: { loaded, errorInfo } }));
      };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" async></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[TopCinema] ✅ Service Worker registered:', reg.scope);
              
              // Check for updates
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[TopCinema] 🔄 New version available. Updating...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                });
              });
            })
            .catch(err => console.warn('[TopCinema] ⚠️ SW registration failed:', err));
        });

        // Handle controller change (new SW activated)
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
